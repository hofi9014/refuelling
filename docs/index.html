<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Refuelling</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Refuelling">
<style>
:root{--bg:#f4f6f8;--card:#fff;--text:#14202b;--muted:#5d6b78;--line:#dfe4ea;--accent:#0f766e;--accent-soft:#d5f0ec;--on-accent:#fff;--warn:#b45309;--warn-soft:#fdf0dc;--danger:#b91c1c;--danger-soft:#fde2e2;--radius:14px;
 --c-fuel:#0f766e;--c-charge:#2563eb;--c-svc:#d97706;--c-fix:#7c3aed;--c-oth:#64748b}
@media (prefers-color-scheme:dark){:root{--bg:#0d1419;--card:#16212a;--text:#e6edf3;--muted:#93a1ae;--line:#26343f;--accent:#2dd4bf;--accent-soft:#123a36;--on-accent:#04201d;--warn:#f59e0b;--warn-soft:#3a2a10;--danger:#f87171;--danger-soft:#3b1717;
 --c-fuel:#2dd4bf;--c-charge:#60a5fa;--c-svc:#fbbf24;--c-fix:#a78bfa;--c-oth:#94a3b8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(84px + var(--sab))}
/* Safe areas: the Android app draws edge-to-edge and Capacitor puts the bar sizes in --safe-area-inset-*; browsers/iOS use env(). */
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(12px + var(--sat)) 16px 12px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){header{background:#0f3d39}}
header h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
select{max-width:100%}
nav button{overflow:hidden}
nav .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zoom-xl nav .lbl{display:none} /* at 175%+ the tab bar shows icons only, so all tabs still fit */
.zoom-xl nav button{padding:12px 0}
header select{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 8px;font:inherit;max-width:55vw;width:auto}
header select option{color:#000}
main{max-width:860px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:var(--sab);z-index:5}
nav button{flex:1;max-width:150px;background:none;border:0;border-radius:0;color:var(--muted);padding:9px 2px 8px;font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:4px 0 12px}
h3{font-size:14px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
button,.btn{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.small{padding:4px 10px;font-size:13px}
.ghost{background:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border-radius:99px;padding:5px 12px;font-size:13px}
.chips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.stat .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .v.good{color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted)}
.car{display:flex;gap:14px;align-items:center}
.car{flex-wrap:wrap}
.car .main{flex:1 1 130px!important;min-width:0;overflow-wrap:break-word}
.car>button{flex-shrink:0}
.car img,.car .ph{width:30%;max-width:120px;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:10px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0}
.car .n{font-size:18px;font-weight:700}
.muted{color:var(--muted)}
.list .item{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.list .item:first-child{border-top:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.item .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.thumb{width:46px;height:46px;border-radius:8px;object-fit:cover;cursor:zoom-in;border:1px solid var(--line);flex-shrink:0}
.kic{width:46px;height:46px;border-radius:8px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
dialog{border:0;border-radius:var(--radius);padding:0;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--text);max-height:90vh}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:13px;color:var(--muted)}
.field small,.chk+small{font-size:12px;color:var(--muted)}
input,select,textarea{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);width:100%}
textarea{min-height:70px;resize:vertical}
.chk{display:flex;gap:8px;align-items:center}
.chk input{width:auto}
.photo img{max-width:100%;max-height:200px;border-radius:10px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.live{font-weight:600;color:var(--accent)}
.warnbox{background:var(--warn-soft);color:var(--warn);padding:8px 10px;border-radius:10px;font-size:13px}
#lightbox{background:transparent;width:auto;max-width:96vw}
#lightbox img{max-width:96vw;max-height:88vh;display:block;border-radius:10px;cursor:zoom-in}
#lightbox.big{width:100vw;max-width:100vw;height:100vh;max-height:100vh;margin:0;overflow:auto;background:#000;border-radius:0}
#lightbox.big img{max-width:none;max-height:none;width:250%;border-radius:0;cursor:zoom-out}
#zoomBtn{background:rgba(255,255,255,.15);color:#fff;border:0;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
svg text{fill:var(--muted);font-size:11px}
.card svg{max-height:240px;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hbr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;margin:9px 0;font-size:14px}
.hbt{background:var(--bg);border-radius:6px;height:12px;overflow:hidden;grid-column:1/-1;order:3}
.hbt div{height:100%;border-radius:6px}
.hbv{font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:6px 6px;border-bottom:1px solid var(--line)}
.tbl td{padding:7px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.scroll{overflow-x:auto}
#fab{position:fixed;right:16px;bottom:calc(74px + var(--sab));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--on-accent);border:0;font-size:30px;justify-content:center;padding:0;box-shadow:0 6px 18px rgba(0,0,0,.28);z-index:6}
@media (min-width:900px){#fab{right:calc(50% - 430px)}}
dialog.sheet{margin:auto auto 0;width:min(560px,100vw);max-width:100vw;border-radius:20px 20px 0 0;padding-bottom:var(--sab)}
.sheet-list{display:flex;flex-direction:column;padding:12px 8px}
.sheet-list button{border:0;background:none;justify-content:flex-start;gap:18px;padding:15px 16px;font-size:16px;border-radius:12px}
.sheet-list button:hover{background:var(--bg)}
.sheet-list .ic{font-size:22px;width:28px;text-align:center}
.carbig{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:6px 0}
.kpi .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .u,.slide .u{font-size:12px;color:var(--muted);font-weight:400}
.kpi .l{margin-left:auto;color:var(--muted);font-size:13px;text-align:right}
.trend{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.trend.good,.good-t{color:#16a34a}
.trend.bad,.bad-t{color:var(--danger)}
.sect{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 8px;display:inline-block;margin:8px 0 2px}
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;margin-bottom:8px}
.slide .grid{display:grid;grid-template-columns:minmax(105px,36%) 1fr;gap:10px;align-items:center}
.slide .sv{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.slide .sl{font-size:12px;color:var(--muted);margin-top:6px}
.dots{display:flex;justify-content:center;gap:7px;margin:0 0 14px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:20px;top:8px;bottom:8px;width:2px;background:var(--accent-soft)}
.tl-m{position:relative;display:flex;align-items:center;gap:14px;margin:14px 0 4px;color:var(--accent);font-weight:600}
.tl-m::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--accent);margin-left:14px;flex-shrink:0}
.tl-i{position:relative;display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
.tl-ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.tl-i .main{flex:1;min-width:0}
.tl-i .t{font-weight:600}
.tl-i .s{font-size:13px;color:var(--muted)}
.tl-i .r{text-align:right;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.leg{color:var(--accent);font-weight:600}
.near{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.near button{justify-content:space-between;text-align:left}
[hidden]{display:none!important}
#printArea{display:none}
.rep{color:#000;background:#fff;font:12px/1.45 system-ui,"Segoe UI",sans-serif}
.rep h1{font-size:22px;margin:0}
.rep h2{font-size:16px;margin:2px 0 10px;color:#333}
.rep h3{color:#0f766e;border-bottom:2px solid #0f766e;padding-bottom:3px;margin:20px 0 8px;text-transform:none;font-size:14px;letter-spacing:0}
.rep-h{display:flex;gap:18px;align-items:flex-start}
.rep-h img{width:220px;height:145px;object-fit:cover;border-radius:8px}
.rep table{width:100%;border-collapse:collapse}
.rep td,.rep th{text-align:left;padding:5px 6px;border-bottom:1px solid #ddd;vertical-align:top}
.rep th{background:#eef5f4}
.rep .kv td:first-child{color:#555;width:42%}
.rep .n{text-align:right;white-space:nowrap}
.rep .att{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep figure{margin:0;break-inside:avoid}
.rep figure img{width:100%;max-height:330px;object-fit:contain;border:1px solid #ddd}
.rep figcaption{font-size:11px;color:#555}
.rep .foot{margin-top:24px;color:#777;font-size:10px}
@media print{
 @page{margin:14mm}
 body{background:#fff!important;padding:0}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 tr{break-inside:avoid}
}
</style>
</head>

/* Downscale a photo to a JPEG data URL. createImageBitmap handles EXIF rotation and big phone photos better;
   the <img> path is the fallback for browsers without it. Throws if the browser can't decode the format (e.g. HEIC). */
function decodeImg(file){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"))};img.src=url})}
/* HEIC/HEIF (default on many Samsungs and iPhones) can't be decoded by Chrome, so it is decoded with libheif (WebAssembly),
   with the older heic2any as a second try. Both are large (2 MB / 1.3 MB), so they load only when such a photo shows up. */
async function isHeic(file){
 if(/hei[cf]/i.test(file.type+file.name))return true;
 const b=new Uint8Array(await file.slice(4,12).arrayBuffer());
 return String.fromCharCode(...b).startsWith("ftyp")&&/^(heic|heix|hevc|heim|heis|mif1|msf1)$/.test(String.fromCharCode(...b.slice(4)));
}
const libs={};
const loadScript=(src,name)=>libs[src]||(libs[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=()=>res(window[name]);s.onerror=()=>{delete libs[src];s.remove();rej(new Error("heic-lib"))};document.head.appendChild(s)}));
async function heicLibheif(file){
 const lib=await(await loadScript("vendor/libheif-bundle.js","libheif"))();
 const imgs=new lib.HeifDecoder().decode(new Uint8Array(await file.arrayBuffer()));
 if(!imgs?.length)throw new Error("libheif: no image");
 const im=imgs[0],w=im.get_width(),h=im.get_height(),c=document.createElement("canvas");c.width=w;c.height=h;
 const ctx=c.getContext("2d"),data=ctx.createImageData(w,h);
 await new Promise((res,rej)=>im.display(data,d=>d?res():rej(new Error("libheif: display"))));
 ctx.putImageData(data,0,0);imgs.forEach(i=>i.free?.());
 return c;
}
async function heicHeic2any(file){
 const out=await(await loadScript("vendor/heic2any.min.js","heic2any"))({blob:file,toType:"image/jpeg",quality:.9});
 return decodeImg(Array.isArray(out)?out[0]:out);
}
async function decodeAny(file){
 try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch{}
 try{return await decodeImg(file)}catch(e){if(!(await isHeic(file)))throw e}
 try{return await heicLibheif(file)}catch(e1){
  console.warn(e1);
  try{return await heicHeic2any(file)}catch(e2){
   if(e1.message==="heic-lib"&&e2.message==="heic-lib")throw e1;
   throw new Error(`${e1.message||e1}; ${e2.message||e2.code||e2}`);
  }
 }
}
async function compress(file,max=1600,q=.75){
 const src=await decodeAny(file);
 const s=Math.min(1,max/Math.max(src.width,src.height)),c=document.createElement("canvas");
 c.width=Math.max(1,Math.round(src.width*s));c.height=Math.max(1,Math.round(src.height*s));
 c.getContext("2d").drawImage(src,0,0,c.width,c.height);src.close?.();
 const out=c.toDataURL("image/jpeg",q);
 if(out.length<200)throw new Error("canvas");
 return out;
}

/* Fuel consumption: full-to-full method. Fuel from partial fill-ups between two full ones is added to the next full one. */
function consumption(){
 const list=mine(S.fuel).slice().sort(byOdo);
 const map={};let last=null,acc=0,totQ=0,totD=0;
 for(const f of list){
  if(last)acc+=+f.qty;
  if(f.full){
   if(last){const d=f.odo-last.odo;if(d>0){map[f.id]=U().cons(acc,d);totQ+=acc;totD+=d}}
   last=f;acc=0;
  }
 }
 const first=list[0],dist=list.length>1?list[list.length-1].odo-first.odo:0,cost=sum(list,fuelTotal),qty=sum(list,f=>+f.qty||0);
 // the first fill-up's fuel was burned before the tracked distance, so it is left out of cost per distance
 return{map,list,avg:totD?U().cons(totQ,totD):null,series:list.filter(f=>map[f.id]!=null).map(f=>map[f.id]),cost,qty,avgPrice:qty?cost/qty:null,dist,costPer100:dist?(cost-fuelTotal(first))/dist*100:null};
}
/* EV energy use. Average: energy charged after the first charge over the distance driven (grid energy, incl. charging losses),
   corrected for the difference in battery level between the first and the last charge. Per charge: battery % used since the previous charge. */
function evStats(){
 const V=veh(),u=U(),bat=+V.battery||0,list=mine(S.charges).slice().sort(byOdo),map={};
 let totE=0;
 list.forEach((c,i)=>{const p=list[i-1];if(!p)return;totE+=+c.kwh||0;const d=c.odo-p.odo;
  if(d>0&&bat&&p.socTo!=null&&c.socFrom!=null&&p.socTo>c.socFrom)map[c.id]=u.econs((p.socTo-c.socFrom)/100*bat,d)});
 const first=list[0],last=list[list.length-1],dist=list.length>1?last.odo-first.odo:0;
 if(bat&&dist&&first.socTo!=null&&last.socTo!=null)totE+=(first.socTo-last.socTo)/100*bat;
 const cost=sum(list,chargeTotal),kwh=sum(list,c=>+c.kwh||0),home=sum(list.filter(c=>c.ct==="home"),c=>+c.kwh||0),tracked=cost-(first?chargeTotal(first):0);
 const savings=V.fuelType==="ev"&&V.refCons&&V.refPrice&&dist>0?u.used(+V.refCons,dist)*V.refPrice-tracked:null;
 return{map,list,avg:dist>0&&totE>0?u.econs(totE,dist):null,series:list.filter(c=>map[c.id]!=null).map(c=>map[c.id]),cost,kwh,avgPrice:kwh?cost/kwh:null,homeShare:kwh?home/kwh:null,dist,costPer100:dist?tracked/dist*100:null,savings};
}

 if(f.type==="select")return`<label class="field"><span>${esc(f.label)}</span><select id="${id}">${f.options.map(([val,lab])=>`<option value="${esc(val)}" ${val==v?"selected":""}>${esc(lab)}</option>`).join("")}</select></label>`;
 if(f.type==="textarea")return`<label class="field"><span>${esc(f.label)}</span><textarea id="${id}">${esc(v)}</textarea></label>`;
 if(f.type==="html")return f.html;
 const n=f.type==="number";
 return`<label class="field"><span>${esc(f.label)}${f.req?" *":""}</span><input id="${id}" type="${f.type||"text"}" ${n?`step="any" min="0" inputmode="decimal"`:""} ${f.req?"required":""} value="${v==null?"":esc(v)}" ${f.ph?`placeholder="${esc(f.ph)}"`:""} ${f.list?`list="${f.list}" autocomplete="off"`:""}>${f.hint?`<small>${esc(f.hint)}</small>`:""}</label>`;
}
function openForm(title,fields,vals,onSave,onDelete,onOpen){

 d.innerHTML=`<form id="frm"><h2>${esc(title)}</h2>${body}<div class="row">${onDelete?`<button type="button" class="danger" id="fdel">${t("delete")}</button>`:""}<span class="sp"></span><button type="button" id="fcancel">${t("cancel")}</button><button class="primary">${t("save")}</button></div></form>`;
 const flat=fields.flat(),photos={};
 flat.filter(f=>f.type==="photo").forEach(f=>{
  photos[f.k]=vals[f.k]||null;
  const inp=$("#f_"+f.k),pv=$("#f_"+f.k+"_pv"),rm=$("#f_"+f.k+"_rm");
  inp.onchange=async()=>{
   const file=inp.files[0];if(!file)return;

   catch(e){console.error(e);pv.innerHTML=photos[f.k]?`<img src="${photos[f.k]}">`:"";alert(`${t(e.message==="heic-lib"?"photoOffline":/hei[cf]/i.test(file.type+file.name)?"photoHeic":"photoError")}\n\n[${file.type||"?"}, ${num(file.size/1048576,1)} MB, ${e.message||e}]`)}
   finally{sub.disabled=false;inp.value=""}
  };
  rm.onclick=()=>{photos[f.k]=null;pv.innerHTML="";rm.hidden=true;inp.value=""};
 });
 $("#fcancel").onclick=()=>d.close();
 if(onDelete)$("#fdel").onclick=()=>{if(confirm(t("confirmDelete"))){onDelete();d.close();save();render()}};

   o[f.k]=f.type==="photo"?photos[f.k]:f.type==="checkbox"?el.checked:f.type==="number"?(el.value===""?null:parseNum(el.value)):el.value.trim()}
  onSave(o);d.close();save();render();
 };
 d.showModal();onOpen&&onOpen();
}

function odoWarning(list,self,date,odo){

 return odo&&before&&odo<before.odo?`${t("odoWarn")} (${num(before.odo,0)} ${U().d}).`:null;

function areaLine(pts){ // pts: [{v,date}]
 if(pts.length<2)return`<p class="muted" style="font-size:13px">—</p>`;
 const W=300,H=150,P=10,B=22,vals=pts.map(p=>p.v),mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1,avg=vals.reduce((a,b)=>a+b)/vals.length;

 const line=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img"><polygon points="${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}" fill="var(--accent)" opacity=".13"/>
 <line x1="${P}" x2="${W-P}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--accent)" stroke-dasharray="5 5" opacity=".6"/>
 <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="${line}"/>
 ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3.5}" fill="var(--accent)"><title>${shortDate(p.date)}: ${num(p.v,2)}</title></circle>`).join("")}

  keys.forEach(k=>{const v=r.parts[k]||0;if(!v)return;s+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${Math.max(1,y(acc)-y(acc+v))}" rx="3" fill="var(--c-${k})" ${open?`fill-opacity=".3" stroke="var(--c-${k})" stroke-dasharray="4 3"`:""}><title>${shortMonth(r.m)} · ${grpLabel(k)}: ${money(v)}</title></rect>`;acc+=v});

 <h3>${t("serviceHistory")}</h3>

 ${photos.length?`<h3>${t("attachments")}</h3><div class="att">${photos.map(s=>`<figure><img src="${s.photo}" alt=""><figcaption>${fdate(s.date)} · ${esc(s.title||kindLabel(s.kind))}</figcaption></figure>`).join("")}</div>`:""}
 <p class="foot">Refuelling · ${fdate(today())}</p></div>`;

const Cap=name=>window.Capacitor?.Plugins?.[name]; // native plugins of the store app
async function shareFile(name,data){ // store app: write the file, then open Android's share sheet (Drive, Gmail, Files…)
 const{uri}=await Cap("Filesystem").writeFile({path:name,data,directory:"CACHE",encoding:"utf8"});
 await Cap("Share").share({title:name,files:[uri]});
}
function download(name,data,type){
 if(isNative)return shareFile(name,data).catch(e=>{if(!/cancel/i.test(e?.message||""))alert(e?.message||e)});
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importData(e){
 try{const d=JSON.parse(await e.target.files[0].text());if(!d.settings||!Array.isArray(d.vehicles))throw 0;S={...defaults(),...d};await save();alert(t("importOk"));render()}catch{alert(t("importErr"))}
}
/* On phones the backup goes to the share sheet (Google Drive, e-mail…), elsewhere it is downloaded. */
async function exportJson(){
 const name=`refuelling-${today()}.json`,data=JSON.stringify(S),file=new File([data],name,{type:"application/json"});
 let shared=false;
 if(matchMedia("(pointer:coarse)").matches&&navigator.canShare?.({files:[file]})){
  try{await navigator.share({files:[file],title:name});shared=true}catch(e){if(e.name==="AbortError")return}
 }
 if(!shared)download(name,data,"application/json");
 S.lastBackup=today();save();render();
}

/* ---------- install & notifications ---------- */
const APP_VERSION="v10"; // keep in sync with VERSION in sw.js
let installEvt=null;
const isNative=!!window.Capacitor?.isNativePlatform?.(); // running as the Google Play / App Store app
const standalone=()=>isNative||matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(tab==="settings")render()});
addEventListener("appinstalled",()=>{installEvt=null;render()});
async function enableNotifications(){
 if(isNative){
  if((await Cap("LocalNotifications").requestPermissions()).display!=="granted"){alert(t("notifDenied"));return}
  S.settings.notify=true;await save();render();runNotifications();return;
 }
 if((await Notification.requestPermission())!=="granted"){render();return}
 S.settings.notify=true;await save();
 try{const reg=await navigator.serviceWorker?.ready;if(reg?.periodicSync&&(await navigator.permissions.query({name:"periodic-background-sync"})).state==="granted")await reg.periodicSync.register("reminders",{minInterval:12*3600e3})}catch(e){console.warn(e)}
 render();runNotifications();
}
/* Store app: Android itself shows reminders at 9:00 seven days before and on the due date, even when the app is closed.
   The schedule is rebuilt after every change. Odometer-based reminders can only be checked when the app is opened. */
const nid=s=>[...String(s)].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7)&0x3fffffff;
async function scheduleNative(){
 const LN=Cap("LocalNotifications");if(!LN)return;
 const pending=(await LN.getPending()).notifications;
 if(pending.length)await LN.cancel({notifications:pending.map(p=>({id:p.id}))});
 if(!S.settings.notify)return;
 const pl=S.settings.lang==="pl",list=[];
 for(const r of S.reminders){
  const V=S.vehicles.find(v=>v.id===r.vid);if(r.done||!r.date||!V)continue;
  for(const days of [7,0]){
   const at=new Date(r.date+"T09:00");at.setDate(at.getDate()-days);if(at.getTime()<=Date.now())continue;
   list.push({id:nid(r.id+":"+days),title:days?(pl?"Zbliża się termin":"Coming up"):(pl?"Dziś mija termin":"Due today"),body:`${V.name}: ${r.title}`,schedule:{at,allowWhileIdle:true}});
  }
 }
 if(list.length)await LN.schedule({notifications:list.slice(0,60)});
}
async function runNotifications(){
 if(isNative){
  if(!S.settings.notify)return;
  await scheduleNative();
  const n=(await idb.get("notified"))||{},due=dueNotifications(S,n,today());
  if(due.length)await Cap("LocalNotifications").schedule({notifications:due.map(x=>({id:nid(x.key),title:x.title,body:x.body,schedule:{at:new Date(Date.now()+1500)}}))});
  due.forEach(x=>n[x.key]=today());await idb.set("notified",n);return;
 }
 if(!S.settings.notify||!("Notification" in window)||Notification.permission!=="granted")return;
 const reg=await navigator.serviceWorker?.ready;if(!reg)return;
 const n=(await idb.get("notified"))||{};
 for(const x of dueNotifications(S,n,today())){await reg.showNotification(x.title,{body:x.body,tag:x.tag,icon:"icons/icon-192.png",badge:"icons/favicon-32.png"});n[x.key]=today()}
 await idb.set("notified",n);
}

function exportCsv(){
 const u=U(),rows=[];
 mine(S.fuel).forEach(f=>rows.push(["fuel",f.date,f.odo,f.full?"full":"partial","",f.place,f.qty,u.v,f.price,fuelTotal(f).toFixed(2),f.note]));
 mine(S.charges).forEach(c=>rows.push(["charge",c.date,c.odo,c.ct,"",c.place,c.kwh,"kWh",c.price,chargeTotal(c).toFixed(2),c.note]));
 mine(S.services).forEach(s=>rows.push(["cost",s.date,s.odo,s.kind,s.title,s.place,"","","",s.cost!=null?(+s.cost).toFixed(2):"",s.note]));
 rows.sort((a,b)=>a[1].localeCompare(b[1]));
 rows.unshift(["type","date","odometer_"+u.d,"category","description","place","quantity","unit","unit_price","total_"+cur(),"note"]);
 download(`refuelling-${(veh()?.name||"car").replace(/\W+/g,"_")}-${today()}.csv`,"﻿"+rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(";")).join("\n"),"text/csv");
}

 };
 A[b.dataset.act]?.();

 if(e.target.id==="periodSel"){period=e.target.value;render()}

$("#vehSel").onchange=e=>{S.active=e.target.value;save();render()};

(async()=>{
 try{S=await idb.get("state")}catch(e){console.error(e)}
 S=S?{...defaults(),...S}:defaults();
 render();
 if(!S.vehicles.length)vehicleForm();
 if("serviceWorker" in navigator&&location.protocol.startsWith("http")&&!isNative){ // the store app ships its files inside the app, so no service worker there
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.register("sw.js").then(reg=>{
   runNotifications();
   // an installed app stays alive in the background, so look for a new version whenever it comes back to the front
   document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")reg.update().catch(()=>{})});
  }).catch(console.error);
  // a new version took over: reload to run it, unless a form is open (it would lose what was typed)
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded&&!$("#dlg").open){reloaded=true;location.reload()}});
 }
 if(isNative)runNotifications().catch(console.warn);
 navigator.storage?.persist?.(); // ask the browser not to evict the data when space runs low
})();

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17191C">
<title>Tankvia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tankvia">
<style>
/* ===== Tankvia design: "logbook & instrument cluster" =====
   Warm paper and graphite, one signal-amber accent, condensed figures like dashboard gauges, road-marking dashes. */
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-400-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+FEFF}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(fonts/barlow-latin-ext-400-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+FEFF}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(fonts/barlow-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+FEFF}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(fonts/barlow-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+FEFF}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-display:swap;src:url(fonts/barlow-condensed-latin-ext-500-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+FEFF}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(fonts/barlow-condensed-latin-ext-600-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2190-2199,U+2212,U+FEFF}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(fonts/barlow-condensed-latin-ext-700-normal.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+1E00-1EFF,U+20A0-20AB,U+20AD-20C0,U+2C60-2C7F,U+A720-A7FF}

:root{
 --bg:#ECE8DF;--surface:#FBF9F4;--surface-2:#F2EEE5;--ink:#17191C;--ink-2:#585C63;--ink-3:#8A8D93;--line:#DCD6C9;--line-2:#C8C1B2;
 --accent:#E29A17;--accent-ink:#17191C;--accent-soft:#F7E5C0;--head:#17191C;--head-ink:#F2EEE5;--head-2:#2A2D31;
 --good:#2D7A4E;--bad:#B5392C;--warn:#A86400;--warn-soft:#F6E7CA;--danger:#B5392C;--danger-soft:#F4DAD5;
 --c-fuel:#D98A00;--c-charge:#2C6FB7;--c-svc:#A84B32;--c-fix:#2D6E6A;--c-oth:#7B7F86;
 --r:6px;--f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-num:"Barlow Condensed","Barlow",system-ui,sans-serif;
 /* names used by older markup */
 --card:var(--surface);--text:var(--ink);--muted:var(--ink-2);--on-accent:var(--accent-ink);--radius:var(--r);--ic-a:var(--accent)}
@media (prefers-color-scheme:dark){:root{
 --bg:#0E1012;--surface:#171A1D;--surface-2:#1F2327;--ink:#ECE8E0;--ink-2:#A3A7AE;--ink-3:#71757C;--line:#2A2E33;--line-2:#3B4046;
 --accent:#F2AE2E;--accent-soft:#3B2F16;--head:#08090A;--head-ink:#ECE8E0;--head-2:#1F2327;
 --good:#5DB67F;--bad:#E66C5E;--warn:#F2AE2E;--warn-soft:#3B2F16;--danger:#E66C5E;--danger-soft:#3E1E1A;
 --c-fuel:#F2AE2E;--c-charge:#5C9DE8;--c-svc:#E07B60;--c-fix:#4FB3A9;--c-oth:#8E939B}}
/* Safe areas: the Android app draws edge-to-edge and Capacitor puts the bar sizes in --safe-area-inset-*; browsers/iOS use env(). */
:root{--sat:var(--safe-area-inset-top,env(safe-area-inset-top,0px));--sab:var(--safe-area-inset-bottom,env(safe-area-inset-bottom,0px))}
/* with the magnifier (CSS zoom) on, viewport units are not zoomed but px are, so overlays size themselves with --vw/--vh */
:root{--vw:calc(100vw / var(--zoom,1));--vh:calc(100vh / var(--zoom,1))}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15.5px/1.45 var(--f-body);padding-bottom:calc(84px + var(--sab));-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px}
.i.sm{width:15px;height:15px;vertical-align:-2px}
.muted{color:var(--ink-2)}
.u{font:500 13px var(--f-body);color:var(--ink-2);margin-left:3px;letter-spacing:0}

/* header: the dark instrument band with an amber edge */
header{position:sticky;top:0;z-index:5;background:var(--head);color:var(--head-ink);padding:calc(10px + var(--sat)) 16px 10px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--accent)}
header h1{margin:0;flex:1;min-width:0;display:flex;align-items:center;gap:9px;font:700 21px/1 var(--f-num);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
header h1 .logo{width:28px;height:28px;flex-shrink:0}
header select,#zoomBtn{background:var(--head-2);color:var(--head-ink);border:1px solid #3B4046;border-radius:4px;padding:6px 8px;font:600 15px var(--f-num);max-width:45vw;width:auto}
header select option{color:#000;background:#fff}
#zoomBtn{display:inline-flex;align-items:center;gap:5px;cursor:pointer;white-space:nowrap}
#zoomBtn .i{--ic-a:var(--accent)}
main{max-width:860px;margin:0 auto;padding:16px}

/* bottom bar: same dark band, amber needle over the active tab */
nav{position:fixed;bottom:0;left:0;right:0;background:var(--head);display:flex;justify-content:center;padding-bottom:var(--sab);z-index:5}
nav button{position:relative;flex:1;max-width:150px;min-width:0;background:none;border:0;color:#8F949B;padding:10px 2px 8px;font:500 var(--nav-fs,12px) var(--f-num);letter-spacing:var(--nav-ls,.05em);text-transform:uppercase;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;overflow:hidden;--ic-a:#8F949B}
nav button .ic{position:relative;line-height:0}
nav button .i{width:23px;height:23px}
nav button.on{color:var(--head-ink);--ic-a:var(--accent)}
nav button.on::before{content:"";position:absolute;top:0;left:50%;width:28px;height:3px;margin-left:-14px;background:var(--accent)}
nav .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav .badge{position:absolute;top:-6px;right:-12px}
/* magnifier 130%+: stack what sits side by side, so nothing runs off the screen */
.zoom-l .hero{grid-template-columns:1fr}
.zoom-l .hero>img,.zoom-l .hero>.ph{width:100%;aspect-ratio:16/9;max-height:160px}
.zoom-l .hero>button{position:absolute;top:10px;right:10px;background:var(--surface)}
.zoom-l .odo b{width:16px;font-size:18px}
.zoom-l .grid2,.zoom-l .ros{grid-template-columns:1fr}
.zoom-l .ros .ro:nth-child(2){border-top:1px dashed var(--line-2);padding-top:10px}
.zoom-l .list .item{flex-wrap:wrap}
.zoom-l .item>.row,.zoom-l .item .r{width:100%;flex-direction:row;justify-content:flex-end;align-items:center}
.zoom-l .slide .grid>div:first-child{grid-template-columns:1fr 1fr}
.zoom-l .mtab{grid-template-columns:1fr 1fr}
.zoom-l .mtab>span:first-child{display:none}
.zoom-l .mtab>span{grid-column:1/-1;margin-top:6px}
.zoom-l .mtab>b,.zoom-l .mtab>em{text-align:left}
.zoom-l dialog form{padding:0 10px 14px}
.zoom-l dialog form>h2{margin:0 -10px 2px;padding:12px 10px 10px}
.zoom-l input[type=date],.zoom-l input[type=time]{font-size:13px;padding:8px 3px;letter-spacing:0}
.zoom-xl .mtab{grid-template-columns:1fr;gap:4px}
.zoom-xl .mtab>b{display:none}
.zoom-xl .mtab>em{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:18px;flex-wrap:wrap}
.zoom-xl .mtab>em::before{content:attr(data-l);font:600 12px var(--f-num);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.zoom-xl input[type=date],.zoom-xl input[type=time]{font-size:11.5px;padding:8px 2px}
.zoom-xl dialog{width:calc(var(--vw) - 6px)}
.zoom-xl dialog form{padding:0 6px 12px}
.zoom-xl dialog form>h2{margin:0 -6px 2px;padding:12px 6px 10px}
.tl-i .main,.item .main{overflow-wrap:anywhere}
.zoom-xl .tl-i{flex-wrap:wrap}
.zoom-xl .tl-i .main{flex-basis:calc(100% - 52px)}
.zoom-xl .tl-i .r{width:100%}
.mtab>b{overflow-wrap:anywhere}
.ch,h3{flex-wrap:wrap}
h2{overflow-wrap:anywhere;min-width:0}
.badge{white-space:normal;overflow-wrap:anywhere}
input,select,textarea{min-width:0}
.zoom-xl nav .lbl{display:none}
.zoom-xl nav button{padding:12px 0}

/* type */
h2{font:700 22px/1.15 var(--f-num);letter-spacing:.04em;text-transform:uppercase;margin:4px 0 12px;display:flex;align-items:center;gap:8px}
h3{display:flex;align-items:center;gap:10px;font:600 13px var(--f-num);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:22px 0 10px}
h3::after{content:"";flex:1;border-top:2px dashed var(--line-2)}
h3 .i{color:var(--ink)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;position:relative}
.ch{display:flex;align-items:center;gap:9px;margin:-2px 0 12px;font:600 15px var(--f-num);letter-spacing:.09em;text-transform:uppercase}
.ch>.i{width:22px;height:22px}
.ch .sp{flex:1}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}

/* controls */
button,.btn{font:600 15px var(--f-num);letter-spacing:.03em;border-radius:4px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;min-height:38px}
button:active,.btn:active{transform:translateY(1px)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);--ic-a:var(--accent-ink)}
button.danger{color:var(--danger);border-color:var(--danger)}
button.small{padding:4px 10px;font-size:14px;min-height:32px}
.ghost{background:transparent}
button.ghost{border-color:transparent}
button.icon{padding:6px;min-height:34px;min-width:34px;justify-content:center}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border-radius:3px;padding:5px 11px;font-size:14px;min-height:32px;text-transform:uppercase;letter-spacing:.06em}
.chips button.on{background:var(--ink);border-color:var(--ink);color:var(--surface);--ic-a:var(--accent)}
.badge{display:inline-block;font:600 11.5px/1.5 var(--f-num);letter-spacing:.07em;text-transform:uppercase;padding:1px 6px;border-radius:2px;background:var(--accent-soft);color:var(--ink);vertical-align:2px}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.danger{background:var(--danger);color:#fff}
.leg{color:var(--ink);font-weight:600;background:var(--accent-soft);padding:0 4px;border-radius:2px}

/* car hero with a mechanical odometer */
.hero{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}
.hero>img,.hero>.ph{width:104px;aspect-ratio:4/3;border-radius:4px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;cursor:zoom-in}
.hero>.ph{cursor:default}
.hero>.ph .i{width:44px;height:44px;stroke-width:1.4;color:var(--ink-2)}
.hero .main{min-width:0;overflow-wrap:break-word}
.hero .n{font:700 22px/1.1 var(--f-num);letter-spacing:.02em;margin-bottom:6px}
.hero .meta{font-size:13px;color:var(--ink-2);margin-top:6px}
.odo{display:inline-flex;gap:2px;vertical-align:middle}
.odo b{font:600 21px/1 var(--f-num);background:var(--head);color:var(--head-ink);width:19px;padding:4px 0 3px;text-align:center;border-radius:2px;box-shadow:inset 0 -6px 6px -4px rgba(0,0,0,.5),inset 0 6px 6px -4px rgba(0,0,0,.5)}
.odo b:last-child{background:var(--accent);color:var(--accent-ink)}
@media (max-width:420px){.hero{grid-template-columns:auto 1fr}.hero>button{position:absolute;top:10px;right:10px}.hero>img,.hero>.ph{width:84px}}

/* gauge readouts */
.ros{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.ro{padding:10px 0 9px;border-top:1px dashed var(--line-2);min-width:0}
.ros .ro:nth-child(-n+2){border-top:0;padding-top:2px}
.rl{font:600 12px var(--f-num);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.rv{display:flex;align-items:baseline;gap:4px;font:700 26px/1.15 var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.rv .trend{align-self:center}
.rs{font-size:12.5px;color:var(--ink-3)}
.mtab{display:grid;grid-template-columns:1fr auto auto;gap:8px 16px;align-items:center}
.mtab>b{font:600 12px var(--f-num);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);text-align:right}
.mtab>span{display:flex;align-items:center;gap:8px;font-size:14.5px}
.mtab>em{font:700 20px var(--f-num);font-style:normal;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.mtab>em.dim{color:var(--ink-2);font-weight:600}
.trend .i{width:16px;height:16px;stroke:none;fill:currentColor}
.trend{display:inline-flex;color:var(--ink-3)}
.trend.good,.good-t{color:var(--good)}
.trend.bad,.bad-t{color:var(--bad)}

/* stats (reports) */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:11px 13px}
.stat .v{font:700 26px/1.15 var(--f-num);font-variant-numeric:tabular-nums}
.stat .v.good{color:var(--good)}
.stat .l{font:600 12px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.stat .l+.v+.l{text-transform:none;letter-spacing:0;font:400 12.5px var(--f-body);color:var(--ink-3)}

/* lists */
.list .item{display:flex;gap:12px;padding:12px 0;border-top:1px dashed var(--line-2);align-items:flex-start}
.list .item:first-child{border-top:0;padding-top:2px}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600}
.item .s{font-size:13.5px;color:var(--ink-2)}
.item .r{text-align:right;font:700 18px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.thumb{width:44px;height:44px;border-radius:4px;object-fit:cover;cursor:zoom-in;border:1px solid var(--line);flex-shrink:0}
.kic{width:44px;height:44px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;flex-shrink:0}
.kic .i{width:24px;height:24px}
.empty{text-align:center;color:var(--ink-2);padding:26px 10px}
.empty .i{width:40px;height:40px;stroke-width:1.3;display:block;margin:0 auto 8px;color:var(--ink-3)}
.warnbox{background:var(--warn-soft);color:var(--ink);padding:9px 12px;border-radius:2px;border-left:3px solid var(--warn);font-size:14px}
.warnbox .i{color:var(--warn)}
.card.warnbox{border:0;border-left:3px solid var(--warn)}

/* timeline: dashed road line with square stops */
.tl{position:relative}
.tl::before{content:"";position:absolute;left:19px;top:10px;bottom:10px;border-left:2px dashed var(--line-2)}
.tl-m{position:relative;display:flex;align-items:center;gap:14px;margin:16px 0 6px;font:600 14px var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.tl-m::before{content:"";width:12px;height:12px;background:var(--accent);margin-left:14px;flex-shrink:0;transform:rotate(45deg)}
.tl-i{position:relative;display:flex;gap:12px;align-items:flex-start;padding:9px 0;cursor:pointer}
.card>.tl-i{border-top:1px dashed var(--line-2)}
.card>.ch+.tl-i{border-top:0}
.tl-ic{width:40px;height:40px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line-2);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.tl-ic .i{width:23px;height:23px}
.tl-i .main{flex:1;min-width:0}
.tl-i .t{font-weight:600}
.tl-i .s{font-size:13.5px;color:var(--ink-2);display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px}
.tl-i .r{text-align:right;font:700 18px var(--f-num);white-space:nowrap;font-variant-numeric:tabular-nums}
.tl-i .r .s{font:500 13px var(--f-body);justify-content:flex-end}

/* trends carousel */
.carousel{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;scrollbar-width:none;margin:0 -16px;padding:0 16px;scroll-padding:0 16px}
.carousel::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;margin-bottom:8px}
.sect{display:flex;align-items:center;gap:8px;font:600 14px var(--f-num);letter-spacing:.09em;text-transform:uppercase;margin-bottom:8px}
.slide .grid>div:first-child{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line-2)}
.slide .sl{font:600 11.5px var(--f-num);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.slide .sv{font:700 21px/1.15 var(--f-num);font-variant-numeric:tabular-nums}
.slide .sv .u{display:block;margin-left:0;white-space:nowrap}
@media (max-width:340px){.slide .sv{font-size:17px}.mtab{gap:6px 8px}.mtab>em{font-size:16px}}
.slide .sn{font-size:11.5px;color:var(--ink-3);line-height:1.25}
.dots{display:flex;justify-content:center;gap:5px;margin:2px 0 16px}
.dots i{width:14px;height:3px;background:var(--line-2)}
.dots i.on{background:var(--accent);width:24px}

/* charts */
.chart{display:block;max-height:240px}
.chart text{fill:var(--ink-3);font:500 11px var(--f-num);letter-spacing:.03em}
.chart .bv{fill:var(--ink);font:600 11px var(--f-num)}
.chart .area{fill:var(--accent);opacity:.14}
.chart .trace{stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.chart .avgline{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:4 4}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font:500 13px var(--f-num);letter-spacing:.04em;color:var(--ink-2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.hbr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 10px;align-items:center;margin:10px 0;font-size:14.5px}
.hbr>div:first-child{display:flex;align-items:center;gap:8px}
.hbt{background:var(--surface-2);height:10px;overflow:hidden;grid-column:1/-1;order:3}
.hbt div{height:100%}
.hbv{font:700 17px var(--f-num);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbv .muted{font:500 13px var(--f-num)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font:600 12px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:6px;border-bottom:2px solid var(--line-2)}
.tbl td{padding:8px 6px;border-bottom:1px dashed var(--line-2);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl .n{text-align:right}
.tbl b{font:700 16px var(--f-num)}
.scroll{overflow-x:auto}

/* dialogs & forms */
dialog{border:0;border-radius:var(--r);padding:0;width:min(520px,calc(var(--vw) - 24px));background:var(--surface);color:var(--ink);max-height:calc(var(--vh) * .9);box-shadow:0 18px 50px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,11,12,.55)}
dialog form{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
dialog form>h2{margin:0 -18px 2px;padding:14px 18px 12px;border-bottom:3px solid var(--accent);background:var(--head);color:var(--head-ink);font-size:20px;position:sticky;top:0;z-index:1}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font:600 12.5px var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field small,.chk+small{font-size:12.5px;color:var(--ink-3)}
input,select,textarea{font:500 16px var(--f-body);padding:9px 10px;border-radius:4px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);width:100%;max-width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
input[type=number],input[type=date],input[type=time]{font:600 18px var(--f-num);letter-spacing:.02em}
textarea{min-height:70px;resize:vertical}
.chk{display:flex;gap:9px;align-items:center;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.photo img{max-width:100%;max-height:200px;border-radius:4px;display:block;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.live{font-weight:600;color:var(--ink)}
.near{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.near button{justify-content:space-between;text-align:left;font:500 15px var(--f-body)}
dialog.sheet{margin:auto auto 0;width:min(560px,var(--vw));max-width:var(--vw);border-radius:var(--r) var(--r) 0 0;padding-bottom:var(--sab);border-top:3px solid var(--accent)}
.sheet-list{display:flex;flex-direction:column;padding:10px 10px 14px}
.sheet-list button{border:0;border-radius:4px;justify-content:flex-start;gap:14px;padding:12px;font:600 18px var(--f-num);letter-spacing:.04em;text-transform:uppercase;background:none}
.sheet-list button:hover{background:var(--surface-2)}
.sheet-list .kic{width:42px;height:42px}
#lightbox{background:transparent;width:auto;max-width:calc(var(--vw) * .96);box-shadow:none}
#lightbox img{max-width:calc(var(--vw) * .96);max-height:calc(var(--vh) * .88);display:block;border-radius:4px;cursor:zoom-in}
#lightbox.big{width:var(--vw);max-width:var(--vw);height:var(--vh);max-height:var(--vh);margin:0;overflow:auto;background:#000;border-radius:0}
#lightbox.big img{max-width:none;max-height:none;width:250%;border-radius:0;cursor:zoom-out}

/* quick-add key: square amber keycap with a hard shadow */
#fab{position:fixed;right:16px;bottom:calc(76px + var(--sab));width:58px;height:58px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);border:2px solid var(--accent-ink);justify-content:center;padding:0;box-shadow:0 5px 0 var(--accent-ink);z-index:6}
#fab:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-ink)}
#fab .i{width:28px;height:28px;stroke-width:2.4}
@media (min-width:900px){#fab{right:calc(50% - 430px)}}
select{max-width:100%}

/* print report */
#printArea{display:none}
.rep{color:#000;background:#fff;font:12px/1.45 system-ui,"Segoe UI",sans-serif}
.rep h1{font-size:22px;margin:0}
.rep h2{font-size:16px;margin:2px 0 10px;color:#333;text-transform:none;letter-spacing:0;display:block;font-family:inherit}
.rep h3{color:#000;border-bottom:2px solid #E29A17;padding-bottom:3px;margin:20px 0 8px;text-transform:none;font-size:14px;letter-spacing:0;display:block}
.rep h3::after{content:none}
.rep-h{display:flex;gap:18px;align-items:flex-start}
.rep-h img{width:220px;height:145px;object-fit:cover;border-radius:4px}
.rep table{width:100%;border-collapse:collapse}
.rep td,.rep th{text-align:left;padding:5px 6px;border-bottom:1px solid #ddd;vertical-align:top}
.rep th{background:#F2EEE5}
.rep .kv td:first-child{color:#555;width:42%}
.rep .n{text-align:right;white-space:nowrap}
.rep .att{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rep figure{margin:0;break-inside:avoid}
.rep figure img{width:100%;max-height:330px;object-fit:contain;border:1px solid #ddd}
.rep figcaption{font-size:11px;color:#555}
.rep .foot{margin-top:24px;color:#777;font-size:10px}
@media print{
 @page{margin:14mm}
 body{background:#fff!important;padding:0}
 body>*:not(#printArea){display:none!important}
 #printArea{display:block!important}
 tr{break-inside:avoid}
}
</style>

/* ---------- storage (IndexedDB) ---------- */
/* The database keeps its original name "refuelling" (the app's old name): renaming it would lose existing users' data. */
const idb={
 db:null,
 open(){return this.db?Promise.resolve(this.db):new Promise((res,rej)=>{const r=indexedDB.open("refuelling",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(this.db=r.result);r.onerror=()=>rej(r.error)})},
 async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
 async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction("kv","readwrite");tx.objectStore("kv").put(v,k);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
};

/* Downscale a photo to a JPEG data URL. createImageBitmap handles EXIF rotation and big phone photos better;

/* Fuel consumption: full-to-full method. Fuel from partial fill-ups between two full ones is added to the next full one. */
function consumption(){
 const list=mine(S.fuel).slice().sort(byOdo);
 const map={};let last=null,acc=0,totQ=0,totD=0;
 for(const f of list){
  if(last)acc+=+f.qty;
  if(f.full){
   if(last){const d=f.odo-last.odo;if(d>0){map[f.id]=U().cons(acc,d);totQ+=acc;totD+=d}}
   last=f;acc=0;
  }
 }
 const first=list[0],dist=list.length>1?list[list.length-1].odo-first.odo:0,cost=sum(list,fuelTotal),qty=sum(list,f=>+f.qty||0);
 // the first fill-up's fuel was burned before the tracked distance, so it is left out of cost per distance
 return{map,list,avg:totD?U().cons(totQ,totD):null,series:list.filter(f=>map[f.id]!=null).map(f=>map[f.id]),cost,qty,avgPrice:qty?cost/qty:null,dist,costPer100:dist?(cost-fuelTotal(first))/dist*100:null};
}
/* EV energy use. Average: energy charged after the first charge over the distance driven (grid energy, incl. charging losses),
   corrected for the difference in battery level between the first and the last charge. Per charge: battery % used since the previous charge. */
function evStats(){
 const V=veh(),u=U(),bat=+V.battery||0,list=mine(S.charges).slice().sort(byOdo),map={};
 let totE=0;
 list.forEach((c,i)=>{const p=list[i-1];if(!p)return;totE+=+c.kwh||0;const d=c.odo-p.odo;
  if(d>0&&bat&&p.socTo!=null&&c.socFrom!=null&&p.socTo>c.socFrom)map[c.id]=u.econs((p.socTo-c.socFrom)/100*bat,d)});
 const first=list[0],last=list[list.length-1],dist=list.length>1?last.odo-first.odo:0;
 if(bat&&dist&&first.socTo!=null&&last.socTo!=null)totE+=(first.socTo-last.socTo)/100*bat;
 const cost=sum(list,chargeTotal),kwh=sum(list,c=>+c.kwh||0),home=sum(list.filter(c=>c.ct==="home"),c=>+c.kwh||0),tracked=cost-(first?chargeTotal(first):0);
 const savings=V.fuelType==="ev"&&V.refCons&&V.refPrice&&dist>0?u.used(+V.refCons,dist)*V.refPrice-tracked:null;
 return{map,list,avg:dist>0&&totE>0?u.econs(totE,dist):null,series:list.filter(c=>map[c.id]!=null).map(c=>map[c.id]),cost,kwh,avgPrice:kwh?cost/kwh:null,homeShare:kwh?home/kwh:null,dist,costPer100:dist?tracked/dist*100:null,savings};
}
/* Averages shown anywhere in the app come from these helpers, so the same number never differs between screens.
   Consumption: distance-weighted (consumption()/evStats() .avg). Price: volume-weighted, i.e. what a litre / kWh really cost. */
const weightedPrice=(list,qtyOf,costOf)=>{const q=sum(list,qtyOf);return q?sum(list,costOf)/q:null};
/* Monthly average: total ÷ days actually covered × 30.44. The window runs from the first record (or the period start, if later)
   to today (or the period end), so months before the first record and the unfinished current month don't distort it.
   With less than 4 weeks of data there is no honest monthly figure yet, so it returns null. */
function monthlyAvg(items,from,to){

 const first=items.map(x=>x.date).sort()[0],start=from&&from>first?from:first,end=to&&to<today()?to:today();

}

/* ---------- reminders status ---------- */
function remStatus(r){
 if(r.done)return null;
 const odo=curOdo(),dd=r.date?Math.round((new Date(r.date+"T12:00")-new Date(today()+"T12:00"))/864e5):null,dk=r.odo?r.odo-odo:null;
 const over=(dd!=null&&dd<0)||(dk!=null&&dk<=0),soon=(dd!=null&&dd<=30)||(dk!=null&&dk<=1000);
 const parts=[];if(dd!=null)parts.push(dd>=0?`${dd} ${t("days")}`:`${-dd} ${t("days")} ${t("ago")}`);if(dk!=null)parts.push(`${num(Math.abs(dk),0)} ${U().d}${dk>=0?" "+t("remaining"):""}`);
 return{cls:over?"danger":soon?"warn":"",label:over?t("overdue"):soon?t("soon"):"",txt:parts.join(" · ")};
}
const sortRem=a=>a.slice().sort((x,y)=>(x.date||"9999").localeCompare(y.date||"9999")||(x.odo||1e12)-(y.odo||1e12));

/* ---------- charts ---------- */
const shortDate=s=>new Intl.DateTimeFormat(loc(),{day:"2-digit",month:"short"}).format(new Date(s+"T12:00"));

/* Small trend charts for the dashboard carousel: area line with a dashed average, and (stacked) month bars. */
function areaLine(pts,avg){ // pts: [{v,date}]; avg: the app-wide average drawn as the dashed line (same number as next to the chart)
 if(pts.length<2)return`<p class="muted" style="font-size:13px">—</p>`;
 const W=320,H=140,P=10,B=22,vals=pts.map(p=>p.v).concat(avg!=null&&isFinite(avg)?[avg]:[]),mn=Math.min(...vals),mx=Math.max(...vals),rg=mx-mn||1;
 const x=i=>P+i*(W-2*P)/(pts.length-1),y=v=>P+(H-P-B)*(1-(v-mn)/rg);
 const line=pts.map((p,i)=>`${x(i)},${y(p.v)}`).join(" ");
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" class="chart"><polygon points="${x(0)},${H-B} ${line} ${x(pts.length-1)},${H-B}" class="area"/>
 ${avg!=null&&isFinite(avg)?`<line x1="${P}" x2="${W-P}" y1="${y(avg)}" y2="${y(avg)}" class="avgline"><title>${t("avg")}: ${num(avg,2)}</title></line>`:""}
 <polyline fill="none" class="trace" points="${line}"/>
 ${pts.map((p,i)=>`<rect x="${x(i)-(i===pts.length-1?4.5:3)}" y="${y(p.v)-(i===pts.length-1?4.5:3)}" width="${i===pts.length-1?9:6}" height="${i===pts.length-1?9:6}" class="${i===pts.length-1?"pt last":"pt"}"><title>${shortDate(p.date)}: ${num(p.v,2)}</title></rect>`).join("")}
 <text x="${P}" y="${H-4}">${shortDate(pts[0].date)}</text><text x="${W-P}" y="${H-4}" text-anchor="end">${shortDate(pts.at(-1).date)}</text></svg>`;
}
const moneyRound=v=>v==null||!isFinite(v)?"—":new Intl.NumberFormat(loc(),{style:"currency",currency:cur(),maximumFractionDigits:0}).format(v);
/* Value under a bar: whole currency units; with many bars the label turns vertical so every bar still gets its own amount. */
const barValue=(x,yBase,v,many)=>many?`<text x="${x}" y="${yBase}" class="bv" transform="rotate(-90 ${x} ${yBase})" text-anchor="end" dominant-baseline="middle">${moneyRound(v)}</text>`:`<text x="${x}" y="${yBase}" class="bv" text-anchor="middle">${moneyRound(v)}</text>`;
function monthBars(rows,keys){ // rows: [{m,parts:{key:value}}]; the current (unfinished) month is drawn dashed
 const W=320,H=170,T=10,B=40,tot=r=>keys.reduce((a,k)=>a+(r.parts[k]||0),0),max=Math.max(1,...rows.map(tot)),bw=(W-8)/rows.length,y=v=>T+(H-T-B)*(1-v/max),cm=today().slice(0,7);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" class="chart">`;
 rows.forEach((r,i)=>{let acc=0;const x=4+i*bw+bw*.2,w=bw*.6,open=r.m===cm;
  keys.forEach(k=>{const v=r.parts[k]||0;if(!v)return;s+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${Math.max(1,y(acc)-y(acc+v))}" fill="var(--c-${k})" ${open?`fill-opacity=".28" stroke="var(--c-${k})" stroke-dasharray="3 2"`:""}><title>${shortMonth(r.m)} · ${grpLabel(k)}: ${money(v)}</title></rect>`;acc+=v});
  s+=`<text x="${x+w/2}" y="${H-22}" text-anchor="middle">${shortMonth(r.m)}</text>`+barValue(x+w/2,H-6,acc,false)});

}
function stackedBars(rows){
 const many=rows.length>8,W=640,B=many?96:48,H=200+B,L=58,T=10,tot=r=>GROUPS.reduce((a,g)=>a+(r.parts[g]||0),0),max=Math.max(1,...rows.map(tot)),bw=(W-L-4)/rows.length,y=v=>T+(H-T-B)*(1-v/max);
 const step=Math.ceil(rows.length/12),present=GROUPS.filter(g=>rows.some(r=>r.parts[g]));
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" class="chart">`;
 [0,.5,1].forEach(f=>{const v=max*f;s+=`<line x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${moneyShort(v)}</text>`});
 rows.forEach((r,i)=>{let acc=0;const x=L+i*bw+bw*.15,w=Math.max(2,bw*.7);
  GROUPS.forEach(g=>{const v=r.parts[g]||0;if(!v)return;s+=`<rect x="${x}" y="${y(acc+v)}" width="${w}" height="${Math.max(1,y(acc)-y(acc+v))}" fill="var(--c-${g})"><title>${grpLabel(g)}: ${money(v)}</title></rect>`;acc+=v});
  if(i%step===0){const d=new Date(r.m+"-15T12:00"),lab=new Intl.DateTimeFormat(loc(),{month:"short"}).format(d)+(r.m.endsWith("-01")||i===0?" "+r.m.slice(2,4):"");s+=`<text x="${x+w/2}" y="${H-B+18}" text-anchor="middle">${lab}</text>`}
  s+=barValue(x+w/2,many?H-B+28:H-8,acc,many);
  if(acc)s+=`<rect x="${L+i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"><title>${r.m}: ${money(acc)}</title></rect>`});

}
function hbars(rows){

function trendArrow(cur,prev,lowerBetter){
 if(cur==null||prev==null||!isFinite(cur)||!isFinite(prev)||Math.abs(cur-prev)<1e-9)return"";
 const down=cur<prev;return`<span class="trend ${down===lowerBetter?"good":"bad"}">${ic(down?"down":"up")}</span>`;
}
const ago=s=>{const d=Math.round((new Date(today()+"T12:00")-new Date(s+"T12:00"))/864e5);return d<=0?t("today"):`${d} ${t("daysAgo")}`};
/* Each slide: last value, the app-wide average (same helpers as the cards and reports) and the change vs the value before. */
function trendSlides(V,f,e,costs){
 const u=U(),lb=S.settings.units==="metric",out=[],cm=today().slice(0,7);
 const slide=({icon,title,unit,lowerBetter,last,prev,avg,avgNote,lastLabel,chart,d=2,fmt})=>{
  const show=v=>v==null||!isFinite(v)?"—":fmt?fmt(v):`${num(v,d)} <span class="u">${unit}</span>`;
  const ch=last!=null&&prev?(last-prev)/prev*100:null,cls=ch==null||Math.abs(ch)<.05?"":(ch<0)===lowerBetter?"good-t":"bad-t";
  const row=(l,v,n)=>`<div><div class="sl">${l}</div><div class="sv">${v}</div>${n?`<div class="sn">${n}</div>`:""}</div>`;
  return`<div class="card slide"><div class="sect">${ic(icon)}${title}</div><div class="grid"><div>
   ${row(lastLabel||t("last"),show(last))}${row(t("avg"),show(avg),avgNote)}
   ${row(t("change"),`<span class="${cls}">${ch==null?"—":(ch>0?"+":"")+num(ch,1)+"%"}</span>`)}</div><div>${chart}</div></div></div>`;
 };
 if(f&&f.series.length){const pts=f.list.filter(x=>f.map[x.id]!=null).map(x=>({v:f.map[x.id],date:x.date}));
  out.push(slide({icon:"drop",title:t("fuelUse"),unit:u.cu,lowerBetter:lb,last:pts.at(-1)?.v,prev:pts.at(-2)?.v,avg:f.avg,avgNote:t("avgAll"),chart:areaLine(pts.slice(-12),f.avg)}))}
 if(e&&e.series.length){const pts=e.list.filter(x=>e.map[x.id]!=null).map(x=>({v:e.map[x.id],date:x.date}));
  out.push(slide({icon:"bolt",title:t("energyUse"),unit:u.ecu,lowerBetter:lb,last:pts.at(-1)?.v,prev:pts.at(-2)?.v,avg:e.avg,avgNote:t("avgAll"),d:1,chart:areaLine(pts.slice(-12),e.avg)}))}
 if(f&&f.list.length){
  const cnt={};f.list.forEach(x=>{const g=x.grade||defGrade(V);cnt[g]=(cnt[g]||0)+1});const g=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const list=f.list.filter(x=>(x.grade||defGrade(V))===g&&x.price).sort((a,b)=>(a.date+(a.time||"")).localeCompare(b.date+(b.time||"")));
  const avg=weightedPrice(list,x=>+x.qty||0,fuelTotal),pts=list.map(x=>({v:+x.price,date:x.date}));
  out.push(slide({icon:"pump",title:`${t("fuelPrices")} · ${gradeLabel(g)}`,unit:`${cur()}/${u.v}`,lowerBetter:true,last:pts.at(-1)?.v,prev:pts.at(-2)?.v,avg,avgNote:t("avgPerUnit"),chart:areaLine(pts.slice(-12),avg)}));
 }
 if(e&&e.list.length){const list=e.list.filter(x=>x.price!=null),avg=weightedPrice(list,x=>+x.kwh||0,chargeTotal),pts=list.map(x=>({v:+x.price,date:x.date}));
  out.push(slide({icon:"bolt",title:t("chargePrices"),unit:`${cur()}/kWh`,lowerBetter:true,last:pts.at(-1)?.v,prev:pts.at(-2)?.v,avg,avgNote:t("avgPerUnit"),chart:areaLine(pts.slice(-12),avg)}))}
 // money per month: "last" is the last finished month (the current one is still running); the bars show every month incl. the current one
 const months=monthList(null,null,costs).slice(-6),grp=k=>{const parts={};costs.filter(x=>x.date.startsWith(k)).forEach(x=>{const g=x.group==="fuel"||x.group==="charge"?x.group:"oth";parts[g]=(parts[g]||0)+x.amount});return{m:k,parts}};
 const rows=months.map(grp),done=rows.filter(r=>r.m!==cm),tot=(r,ks)=>ks.reduce((a,k)=>a+(r.parts[k]||0),0),energyKeys=["fuel","charge"];
 const moneySlide=(icon,title,keys,items)=>{const ma=monthlyAvg(items);out.push(slide({icon,title,lowerBetter:true,fmt:moneyRound,lastLabel:t("prevMonth"),
  last:done.length?tot(done.at(-1),keys):null,prev:done.length>1?tot(done.at(-2),keys):null,avg:ma?.value,avgNote:ma?t("avgMonthNote").replace("{n}",num(ma.months,1)):t("avgTooShort"),chart:monthBars(rows,keys)}))};

}

const isNative=!!window.Capacitor?.isNativePlatform?.(); // running as the Google Play / App Store app

async function enableNotifications(){
 if(isNative){
  if((await Cap("LocalNotifications").requestPermissions()).display!=="granted"){alert(t("notifDenied"));return}
  S.settings.notify=true;await save();render();runNotifications();return;
 }
 if((await Notification.requestPermission())!=="granted"){render();return}
 S.settings.notify=true;await save();
 try{const reg=await navigator.serviceWorker?.ready;if(reg?.periodicSync&&(await navigator.permissions.query({name:"periodic-background-sync"})).state==="granted")await reg.periodicSync.register("reminders",{minInterval:12*3600e3})}catch(e){console.warn(e)}
 render();runNotifications();
}
/* Store app: Android itself shows reminders at 9:00 seven days before and on the due date, even when the app is closed.
   The schedule is rebuilt after every change. Odometer-based reminders can only be checked when the app is opened. */
const nid=s=>[...String(s)].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,7)&0x3fffffff;
async function scheduleNative(){
 const LN=Cap("LocalNotifications");if(!LN)return;
 const pending=(await LN.getPending()).notifications;
 if(pending.length)await LN.cancel({notifications:pending.map(p=>({id:p.id}))});
 if(!S.settings.notify)return;
 const pl=S.settings.lang==="pl",list=[];
 for(const r of S.reminders){
  const V=S.vehicles.find(v=>v.id===r.vid);if(r.done||!r.date||!V)continue;
  for(const days of [7,0]){
   const at=new Date(r.date+"T09:00");at.setDate(at.getDate()-days);if(at.getTime()<=Date.now())continue;
   list.push({id:nid(r.id+":"+days),title:days?(pl?"Zbliża się termin":"Coming up"):(pl?"Dziś mija termin":"Due today"),body:`${V.name}: ${r.title}`,schedule:{at,allowWhileIdle:true}});
  }
 }
 if(list.length)await LN.schedule({notifications:list.slice(0,60)});
}
async function runNotifications(){
 if(isNative){
  if(!S.settings.notify)return;
  await scheduleNative();
  const n=(await idb.get("notified"))||{},due=dueNotifications(S,n,today());
  if(due.length)await Cap("LocalNotifications").schedule({notifications:due.map(x=>({id:nid(x.key),title:x.title,body:x.body,schedule:{at:new Date(Date.now()+1500)}}))});
  due.forEach(x=>n[x.key]=today());await idb.set("notified",n);return;
 }
 if(!S.settings.notify||!("Notification" in window)||Notification.permission!=="granted")return;
 const reg=await navigator.serviceWorker?.ready;if(!reg)return;
 const n=(await idb.get("notified"))||{};
 for(const x of dueNotifications(S,n,today())){await reg.showNotification(x.title,{body:x.body,tag:x.tag,icon:"icons/icon-192.png",badge:"icons/favicon-32.png"});n[x.key]=today()}
 await idb.set("notified",n);
}

 rows.sort((a,b)=>a[1].localeCompare(b[1]));

}
